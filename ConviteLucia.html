<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Lúcia · convite recebido (depois de entrar) · Mapa dos Sintomas (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<template id="tpl">
<div class="scr">
<div class="bar"><span style="width: 44px"></span><span class="ttl">Convite</span><span style="width: 44px"></span></div>
<div class="body" style="gap: 12px; padding-top: 0">
<span class="ico" style="width: 56px; height: 56px; border-radius: 16px"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2 21a7 7 0 0 1 14 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a7 7 0 0 1 4 6.5"></path></svg></span>
<h1 class="h1">A Marina convidou você para ajudar</h1>
<p class="lead">Nos dias difíceis, você pode registrar como vê o dia dela. Ela também registra o dela; um não apaga o outro.</p>
<div class="card stack" style="gap: 8px"><b>O que você vai poder fazer</b>
<span class="row small" style="gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Registrar o dia da Marina, do jeito que você vê</span>
<span class="row small" style="gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Ver a semana dela</span>
<span class="row small muted" style="gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8C93A6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>Você não vê o resumo nem a conta dela</span>
<span class="small muted">A Marina pode tirar o seu acesso quando quiser.</span></div>
<button class="check" onClick="{{t1}}" aria-pressed="{{p1}}"><span class="bx {{c1}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span>Tenho 18 anos ou mais e aceito os <span class="ul">Termos de Uso</span>.</span></button>
<button class="check" onClick="{{t2}}" aria-pressed="{{p2}}"><span class="bx {{c2}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span>Vou usar o que vejo da Marina só para ajudar no cuidado dela, sem repassar a ninguém.</span></button>
</div>
<div class="foot"><sc-if value="{{ok}}" hint-placeholder-val="{{true}}"><a class="btn" href="LuciaHoje.html">Aceitar o convite</a></sc-if><sc-if value="{{no}}" hint-placeholder-val="{{false}}"><button class="btn" onClick="{{warn}}" style="opacity: .55">Aceitar o convite</button></sc-if><sc-if value="{{err}}" hint-placeholder-val="{{false}}"><span class="err" style="text-align: center">Marque as duas caixas para aceitar.</span></sc-if><a class="btn ghost" href="Main.html">Agora não</a></div>
</div>
</template>
<div id="root"></div>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { a: false, b: false, e: false }; }
  renderVals() {
    const s = this.state;
    const ok = s.a && s.b;
    return { c1: s.a ? '' : 'off', c2: s.b ? '' : 'off', p1: s.a ? 'true' : 'false', p2: s.b ? 'true' : 'false',
      t1: () => this.setState({ a: !s.a, e: false }), t2: () => this.setState({ b: !s.b, e: false }),
      ok, no: !ok, err: s.e && !ok, warn: () => this.setState({ e: true }) };
  }
}
</script>
<script>__boot(Component);</script>
</body>
</html>
