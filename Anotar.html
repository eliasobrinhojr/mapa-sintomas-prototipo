<body>
<template id="tpl">
<div class="scr">
<div class="bar"><a class="iconbtn" href="Consulta.html" aria-label="Voltar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#18203A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a><span class="ttl">Anotar</span><a class="crise" href="Crise.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9243F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path><path d="M12 9v4M12 16v.5"></path></svg>Plano de crise</a></div>
<div class="body" style="gap: 12px; padding-top: 0">
<h1 class="h1">O que estou sentindo</h1>
<p class="lead">Anote na hora, numa linha. Não precisa de frase bonita: só fatos.</p>
<div class="stack" style="gap: 6px"><b>O que senti ou aconteceu</b><div class="field">Raiva muito forte, chorei e quis largar tudo</div></div>
<div class="stack" style="gap: 6px"><b>Quanto durou</b><div class="chips"><button class="chip">Menos de 1 h</button><button class="chip on">1 a 3 h</button><button class="chip">3 a 6 h</button><button class="chip">Mais</button></div></div>
<div class="stack" style="gap: 6px"><b>O que veio antes</b><div class="field">Crítica do chefe na reunião</div></div>
<div class="stack" style="gap: 6px"><b>O que mudou no dia</b><div class="field empty">Ex.: não consegui trabalhar à tarde</div></div>
<button class="check" onClick="{{t}}" style="padding: 12px 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E3E6EE"><span class="bx {{c}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span><b style="display: block">★ Contar na consulta</b><span class="small muted">Entra no item “O que mais quero contar”</span></span></button>
<span class="small" style="color: #A9243F">Pensamentos de morte ou de se machucar: não espere a consulta. Ligue 188 (CVV) ou 192.</span>
</div>
<div class="foot"><a class="btn" href="Consulta.html">Salvar anotação</a></div>
</div>
</template>
<div id="root"></div>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { s: true }; }
  renderVals() { return { c: this.state.s ? '' : 'off', t: () => this.setState({ s: !this.state.s }) }; }
}
</script>
<script>__boot(Component);</script>
