<div class="body" style="gap: 14px; padding-top: 0">
<h1 class="h1">Meu plano de crise</h1>
<p class="small muted" style="margin: 0">Faça junto com seu médico ou psicólogo. Os sinais mudam de pessoa para pessoa: aqui entram os seus. Revise quando o tratamento mudar.</p>
<div class="card stack" style="gap: 10px"><div class="sh"><span class="n">1</span><b>Meus primeiros sinais</b></div>
<span class="small" style="font-weight: 700">Quando estou acelerando ou irritado</span>
<div class="stack" style="gap: 6px"><div class="field">Durmo menos e não sinto falta</div><div class="field">Começo vários projetos</div><div class="field">Gasto mais</div><span class="small" style="color: #0A6D62; font-weight: 700">+ Adicionar (até 5)</span></div>
<span class="small" style="font-weight: 700">Quando estou caindo ou me isolando</span>
<div class="stack" style="gap: 6px"><div class="field">Paro de responder mensagens</div><div class="field">Durmo demais</div><span class="small" style="color: #0A6D62; font-weight: 700">+ Adicionar (até 5)</span></div>
<span class="small muted">Esses sinais aparecem no seu registro do dia para você marcar. Se o seu caso não tem fases, use as duas listas para os sinais de que você está pior.</span></div>
<div class="card stack" style="gap: 10px"><div class="sh"><span class="n">2</span><b>O que combinei com meu médico</b></div>
<div class="row" style="gap: 8px; flex-wrap: wrap"><span class="small" style="font-weight: 700">Se eu notar</span><span class="tag" style="height: 40px; font-size: 15px">2</span><span class="small" style="font-weight: 700">sinais ou mais, por</span><span class="tag" style="height: 40px; font-size: 15px">2</span><span class="small" style="font-weight: 700">dias, eu vou:</span></div>
<div class="field">Ligar para a Lúcia</div><div class="field">Avisar o consultório da Dra. Ana</div><span class="small" style="color: #0A6D62; font-weight: 700">+ Adicionar passo</span></div>
<div class="card stack" style="gap: 10px"><div class="sh"><span class="n">3</span><b>Contatos</b></div>
<div class="field">Meu médico · Dra. Ana · (11) 9 ____-____</div><div class="field">Pessoa de confiança · Lúcia · (11) 9 ____-____</div>
<span class="small muted">CVV 188 e SAMU 192 ficam sempre no plano.</span>
<span class="small" style="font-weight: 700">Combinado em 02/10 com Dra. Ana</span></div>
<span class="small muted">Este plano não traz orientação de dose nem de conduta. Nunca mude o remédio por conta própria.</span>
</div>
<div class="foot"><a class="btn" href="Crise.html">Salvar plano</a></div>
