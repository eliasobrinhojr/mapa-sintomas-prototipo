<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Lembrete diário (calendário do celular) · Mapa dos Sintomas (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<template id="tpl">
<div class="scr">
<div class="bar"><a class="iconbtn" href="Conta.html" aria-label="Voltar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#18203A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a><span class="ttl">Conta</span><a class="crise" href="Crise.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9243F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path><path d="M12 9v4M12 16v.5"></path></svg>Plano de crise</a></div>
<div class="body" style="gap: 14px; padding-top: 0">
<h1 class="h1">Lembrete diário</h1>
<p class="lead">Escolha um horário. O lembrete vira um evento diário no calendário do seu celular, com o texto “Seus 20 segundos de hoje”.</p>
<div class="card stack" style="gap: 12px"><b>Horário</b>
<div class="chips"><sc-for list="{{hrs}}" as="h" hint-placeholder-count="5"><button class="chip {{h.cls}}" onClick="{{h.pick}}" aria-pressed="{{h.on}}">{{h.label}}</button></sc-for></div>
<span class="small muted">O padrão é 21:00. O evento não fala de saúde.</span></div>
<sc-if value="{{feito}}" hint-placeholder-val="{{false}}"><div class="card soft small"><b>Pronto.</b> Lembrete criado às {{hora}}. Para mudar, crie outro e apague o antigo no calendário.</div></sc-if>
<div style="flex: 1"></div>
<button class="btn" onClick="{{criar}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Adicionar ao calendário do celular</button>
<button class="btn sec" onClick="{{criar}}">Usar o Google Agenda</button>
</div>
</div>
</template>
<div id="root"></div>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { h: '21:00', ok: false }; }
  renderVals() {
    const s = this.state;
    return { hrs: ['20:00', '21:00', '22:00', '22:30', '23:00'].map((l) => ({ label: l, cls: l === s.h ? 'on' : '', on: l === s.h ? 'true' : 'false', pick: () => this.setState({ h: l, ok: false }) })),
      hora: s.h, feito: s.ok, criar: () => this.setState({ ok: true }) };
  }
}
</script>
<script>__boot(Component);</script>
</body>
</html>
