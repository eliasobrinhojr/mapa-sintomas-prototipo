<div class="body" style="gap: 12px; padding-top: 0">
<h1 class="h1">Pessoa próxima</h1>
<p class="lead">Alguém de confiança pode registrar como vê o seu dia, pelo app dela. O que ela registra aparece marcado como dela.</p>
<div class="card stack" style="gap: 8px"><div class="row"><span class="ico" style="border-radius: 50%"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2D7775" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2 21a7 7 0 0 1 14 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a7 7 0 0 1 4 6.5"></path></svg></span><span style="flex: 1"><b style="display: block">Lúcia (mãe)</b><span class="small muted">Ativa desde 01/10 · registrou 3 dias</span></span></div></div>
<div class="card" style="padding: 4px 16px">
<div class="li"><span class="tx"><b style="display: block">Registrar o meu dia</b><span class="small muted" style="display: block">Do jeito que ela vê. Não muda o que você registra.</span></span><span class="small muted" style="font-weight: 700">sempre</span></div>
<div class="li"><span class="tx"><b style="display: block">Ver a minha semana</b><span class="small muted" style="display: block">Ela não vê o resumo nem a sua conta</span></span><button class="sw {{c1}}" onClick="{{t1}}" role="switch" aria-checked="{{a1}}" aria-label="Ver a minha semana" style="border: 0; cursor: pointer"></button></div>
<div class="li"><span class="tx"><b style="display: block">O que ela registra entra no meu resumo</b><span class="small muted" style="display: block">Marcado com o nome dela, ao lado do seu</span></span><button class="sw {{c2}}" onClick="{{t2}}" role="switch" aria-checked="{{a2}}" aria-label="O que ela registra entra no meu resumo" style="border: 0; cursor: pointer"></button></div>
</div>
<sc-if value="{{ativa}}" hint-placeholder-val="{{true}}"><button class="btn sec" onClick="{{rem}}" style="border-color: #A9243F; color: #A9243F !important">Remover o acesso da Lúcia</button></sc-if>
<sc-if value="{{removida}}" hint-placeholder-val="{{false}}"><div class="toast" style="position: static"><span>Acesso da Lúcia removido.</span><button class="tb" onClick="{{desf}}" style="background: transparent; cursor: pointer; font-family: inherit">Desfazer</button></div></sc-if>
<sc-if value="{{ativa}}" hint-placeholder-val="{{true}}"><span class="small muted" style="text-align: center">Uma pessoa próxima por vez. Para convidar outra, remova este acesso.</span></sc-if>
<sc-if value="{{removida}}" hint-placeholder-val="{{false}}"><a class="btn ghost" href="Convidar.html">Convidar alguém</a></sc-if>

<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { r: false, v: true, z: true }; }
  renderVals() { const s = this.state; return { ativa: !s.r, removida: s.r, rem: () => this.setState({ r: true }), desf: () => this.setState({ r: false }),
    c1: s.v ? '' : 'off', a1: s.v ? 'true' : 'false', t1: () => this.setState({ v: !s.v }),
    c2: s.z ? '' : 'off', a2: s.z ? 'true' : 'false', t2: () => this.setState({ z: !s.z }) }; }
}
</script>
<script>__boot(Component);</script>
