<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Pessoa próxima · Lúcia ativa · Mapa dos Sintomas (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<template id="tpl">
<div class="scr">
<div class="bar"><a class="iconbtn" href="Conta.html" aria-label="Voltar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#18203A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a><span class="ttl">Conta</span><a class="crise" href="Ajuda.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9243F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle><path d="M5.6 5.6l3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6"></path></svg>Ajuda</a></div>
<div class="body" style="gap: 12px; padding-top: 0">
<h1 class="h1">Pessoa próxima</h1>
<p class="lead">Alguém de confiança pode registrar como vê o seu dia, pelo app dela. O que ela registra aparece marcado como dela.</p>
<div class="card stack" style="gap: 8px"><div class="row"><span class="ico" style="border-radius: 50%"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2 21a7 7 0 0 1 14 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a7 7 0 0 1 4 6.5"></path></svg></span><span style="flex: 1"><b style="display: block">Lúcia (mãe)</b><span class="small muted">Ativa desde 01/10 · registrou 3 dias</span></span></div></div>
<div class="card stack" style="gap: 8px"><b>O que ela pode fazer</b>
<span class="row small" style="gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Registrar o seu dia, do jeito que ela vê</span>
<span class="row small" style="gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Ver a sua semana</span>
<span class="row small muted" style="gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8C93A6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>Não vê o resumo nem a sua conta</span>
<span class="row small muted" style="gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8C93A6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>Não muda nem apaga o que você registrou</span></div>
<sc-if value="{{ativa}}" hint-placeholder-val="{{true}}"><button class="btn sec" onClick="{{rem}}" style="border-color: #A9243F; color: #A9243F !important">Remover o acesso da Lúcia</button></sc-if>
<sc-if value="{{removida}}" hint-placeholder-val="{{false}}"><div class="toast" style="position: static"><span>Acesso da Lúcia removido.</span><button class="tb" onClick="{{desf}}" style="background: transparent; cursor: pointer; font-family: inherit">Desfazer</button></div></sc-if>
<a class="btn ghost" href="Convidar.html">+ Convidar outra pessoa</a>
</div>
</div>
</template>
<div id="root"></div>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { r: false }; }
  renderVals() { const s = this.state; return { ativa: !s.r, removida: s.r, rem: () => this.setState({ r: true }), desf: () => this.setState({ r: false }) }; }
}
</script>
<script>__boot(Component);</script>
</body>
</html>
