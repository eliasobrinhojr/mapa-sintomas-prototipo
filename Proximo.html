<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Alguém próximo · Mapa dos Sintomas (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<template id="tpl">
<div class="scr">
<div class="bar"><a class="iconbtn" href="Conta.html" aria-label="Voltar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#18203A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a><span class="ttl"></span><a class="crise" href="Crise.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9243F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path><path d="M12 9v4M12 16v.5"></path></svg>Plano de crise</a></div>
<div class="body" style="gap: 12px; padding-top: 0">
<h1 class="h1">Alguém próximo</h1>
<p class="lead">Nos dias difíceis, outra pessoa pode marcar por você. Você decide o que ela vê.</p>
<div class="card" style="padding: 4px 16px">
<div class="li"><span class="ico" style="border-radius: 50%"><b>L</b></span><span class="tx"><b style="display: block">Lúcia (mãe)</b><span class="small muted">Aceitou o convite em 10/10</span></span><span class="small" style="color: #A9243F; font-weight: 700">Remover</span></div>
<sc-for list="{{perms}}" as="p" hint-placeholder-count="5"><div class="li"><span class="tx"><b style="display: block">{{p.label}}</b><span class="small muted">{{p.sub}}</span></span><button class="sw {{p.cls}}" onClick="{{p.pick}}" aria-label="{{p.label}}" aria-pressed="{{p.on}}"></button></div></sc-for>
</div>
<div class="card soft small">Sinal do plano: o app sempre pergunta antes de avisar alguém. Você pode mudar essas permissões quando quiser.</div>
<a class="btn sec" href="Proximo.html">+ Convidar outra pessoa pelo WhatsApp</a>
<a class="btn ghost" href="ApoioLucia.html">Ver como fica para a Lúcia</a>
</div>
</div>
</template>
<div id="root"></div>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { on: ['r', 'p', 'd', 'n'] }; }
  renderVals() {
    const s = this.state;
    const L = [['r', 'Marcar como ela me vê', 'Se eu não registrar, conta no meu dia. Se eu registrar, fica ao lado, como a visão dela'], ['p', 'Ver meu plano de crise', 'Para saber o que fazer e para quem ligar'], ['w', 'Ver minha semana', 'Desligado: ela não vê seu histórico'], ['d', 'Responder a pergunta de domingo', '“Eu estive diferente do normal?”'], ['n', 'Avisar a Lúcia se eu não registrar', 'Às 22:00, mensagem neutra, sem dados de saúde']];
    const perms = L.map((x) => { const on = s.on.includes(x[0]); return { label: x[1], sub: x[2], cls: on ? '' : 'off', on: on ? 'true' : 'false', pick: () => this.setState({ on: on ? s.on.filter((y) => y !== x[0]) : s.on.concat([x[0]]) }) }; });
    return { perms };
  }
}
</script>
<script>__boot(Component);</script>
</body>
</html>
