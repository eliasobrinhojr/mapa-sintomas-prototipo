<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Assinar o Pro · anual ou mensal · Mapa dos Sintomas (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="app.css?v=202611152143">
<link rel="stylesheet" href="site.css?v=202611152143">
</head>
<body>
<template id="tpl">
<div class="scr aura android"><div class="sb" aria-hidden="true"><span>9:41</span><span class="isl"></span><span class="ic"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 4.2a9.5 9.5 0 0 1 13 0"></path><path d="M4 7a5.8 5.8 0 0 1 8 0"></path><circle cx="8" cy="10.2" r="1.2" fill="currentColor" stroke="none"></circle></svg><svg width="26" height="12" viewBox="0 0 26 12" fill="currentColor"><rect x="0.5" y="0.5" width="22" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".45"></rect><rect x="2" y="2" width="19" height="8" rx="2"></rect><rect x="24" y="4" width="2" height="4" rx="1" opacity=".5"></rect></svg></span></div>
<div class="bar"><a class="iconbtn" href="Planos.html" aria-label="Voltar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#202A35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6"></path></svg></a><span class="ttl">Planos</span><a class="crise" href="Ajuda.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9243F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle><path d="M5.6 5.6l3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6"></path></svg>Ajuda</a></div>
<div class="body" style="gap: 12px; padding-top: 0">
<h1 class="h1">Pro</h1>
<p class="small muted" style="margin: 0">A consulta preparada: resumo maior, gráfico, data da consulta e anotações.</p>
<div class="stack" style="gap: 10px"><sc-for list="{{ops}}" as="o" hint-placeholder-count="2"><button class="opt {{o.cls}}" onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="min-height: 68px"><span class="stack" style="gap: 2px"><b>{{o.t}}</b><span class="small muted">{{o.s}}</span></span><span class="r"></span></button></sc-for></div>
<sc-if value="{{anual}}" hint-placeholder-val="{{true}}"><div class="card stack" style="gap: 8px"><b>Como funciona</b>
<span class="small"><b>Hoje:</b> começam os 7 dias grátis.</span>
<span class="small"><b>23/10:</b> avisamos que o período grátis está acabando.</span>
<span class="small"><b>25/10:</b> a loja cobra R$ 99,90 pelo primeiro ano.</span></div></sc-if>
<sc-if value="{{mensal}}" hint-placeholder-val="{{false}}"><div class="card stack" style="gap: 8px"><b>Como funciona</b><span class="small">A loja cobra R$ 14,90 hoje e todo mês, até você cancelar.</span></div></sc-if>
<div style="flex: 1"></div>
<a class="btn" href="PlanoAtivo.html">{{cta}}</a>
<span class="small muted" style="text-align: center">A cobrança é feita pela loja do seu celular. Cancele quando quiser em Conta › Meu plano. Cancelar não apaga os seus registros.</span>
<span class="small" style="text-align: center"><span class="ul">Restaurar compra</span> · <span class="ul">Termos</span> · <span class="ul">Privacidade</span></span>
</div>
<div class="hi" aria-hidden="true"></div></div>
</template>
<div id="root"></div>
<script src="icones.js?v=202611152143"></script>
<script src="runtime.js?v=202611152143"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { p: 'a' }; }
  renderVals() {
    const s = this.state, a = s.p === 'a';
    const ops = [['a', 'Anual · R$ 99,90 por ano', 'Sai a R$ 8,33 por mês · 7 dias grátis'], ['m', 'Mensal · R$ 14,90 por mês', 'Sem período grátis']].map((x) => ({ t: x[1], s: x[2], cls: s.p === x[0] ? 'on' : '', on: s.p === x[0] ? 'true' : 'false', pick: () => this.setState({ p: x[0] }) }));
    return { ops: ops, anual: a, mensal: !a, cta: a ? 'Começar os 7 dias grátis' : 'Assinar por R$ 14,90 por mês' };
  }
}
</script>
<script>__boot(Component);</script>
</body>
</html>
