<div class="body" style="gap: 12px; padding-top: 0">
<h1 class="h1">Ícones do humor</h1>
<p class="small muted" style="margin: 0">Escolha o desenho de cada nível. A cor e a palavra de cada nível continuam as mesmas.</p>
<div class="pvi" role="img" aria-label="Como ficou: os 5 níveis com os desenhos escolhidos"><span class="c"><span class="face e1 {{pA}}" aria-hidden="true"></span>Acelerado</span><span class="c"><span class="face e3 {{pG}}" aria-hidden="true"></span>Animado</span><span class="c"><span class="face e4 {{pN}}" aria-hidden="true"></span>Normal</span><span class="c"><span class="face e5 {{pB}}" aria-hidden="true"></span>Pra baixo</span><span class="c"><span class="face e7 {{pM}}" aria-hidden="true"></span>Muito para baixo</span></div>
<div class="card stack" style="gap: 10px"><span class="h3">Trocar todos de uma vez</span>
<div class="chips"><sc-for list="{{conj}}" as="x" hint-placeholder-count="5"><button class="chip {{x.cls}}" onClick="{{x.pick}}" aria-pressed="{{x.on}}" style="min-height: 44px; padding: 0 14px">{{x.label}}</button></sc-for></div></div>
<div class="card stack" style="gap: 0"><span class="h3" style="margin-bottom: 10px">Ou um por um</span>
<div class="icl"><b>Acelerado ou fora do controle</b><div class="ics" role="group" aria-label="Desenho para: Acelerado ou fora do controle"><sc-for list="{{opA}}" as="o" hint-placeholder-count="5"><button class="ic {{o.cls}}" onClick="{{o.pick}}" aria-pressed="{{o.on}}"><span class="face e1 {{o.oc}}" aria-hidden="true"></span>{{o.label}}</button></sc-for></div></div><div class="icl"><b>Animado</b><div class="ics" role="group" aria-label="Desenho para: Animado"><sc-for list="{{opG}}" as="o" hint-placeholder-count="5"><button class="ic {{o.cls}}" onClick="{{o.pick}}" aria-pressed="{{o.on}}"><span class="face e3 {{o.oc}}" aria-hidden="true"></span>{{o.label}}</button></sc-for></div></div><div class="icl"><b>Normal para mim</b><div class="ics" role="group" aria-label="Desenho para: Normal para mim"><sc-for list="{{opN}}" as="o" hint-placeholder-count="5"><button class="ic {{o.cls}}" onClick="{{o.pick}}" aria-pressed="{{o.on}}"><span class="face e4 {{o.oc}}" aria-hidden="true"></span>{{o.label}}</button></sc-for></div></div><div class="icl"><b>Pra baixo</b><div class="ics" role="group" aria-label="Desenho para: Pra baixo"><sc-for list="{{opB}}" as="o" hint-placeholder-count="5"><button class="ic {{o.cls}}" onClick="{{o.pick}}" aria-pressed="{{o.on}}"><span class="face e5 {{o.oc}}" aria-hidden="true"></span>{{o.label}}</button></sc-for></div></div><div class="icl"><b>Muito para baixo, tudo custa</b><div class="ics" role="group" aria-label="Desenho para: Muito para baixo, tudo custa"><sc-for list="{{opM}}" as="o" hint-placeholder-count="5"><button class="ic {{o.cls}}" onClick="{{o.pick}}" aria-pressed="{{o.on}}"><span class="face e7 {{o.oc}}" aria-hidden="true"></span>{{o.label}}</button></sc-for></div></div>
</div>
<div class="card" style="padding: 4px 16px">
<div class="li" style="border-top: 0"><span class="tx"><b style="display: block">Usar meus ícones no resumo para o profissional</b><span class="small muted" style="display: block">A palavra de cada nível aparece sempre ao lado do desenho.</span></span><button class="sw {{cr}}" onClick="{{tr}}" role="switch" aria-checked="{{ar}}" aria-label="Usar meus ícones no resumo para o profissional" style="border: 0; cursor: pointer"></button></div>

</div>

<script>
class Component extends DCLogic {
  constructor(props) { super(props); const g = (typeof window !== 'undefined' && window.__icones) ? window.__icones.ler() : null;
    this.state = g ? { A: g.A, G: g.G, N: g.N, B: g.B, M: g.M, rel: g.rel !== false } : { A: 0, G: 0, N: 0, B: 0, M: 0, rel: true }; }
  renderVals() {
    const s = this.state, C = ["Carinha", "Traço", "Clima", "Bateria", "Só cor"], K = ['A', 'G', 'N', 'B', 'M'];
    const set = (o) => { if (typeof window !== 'undefined' && window.__icones) window.__icones.gravar(o); this.setState(o); };
    const ops = (k) => C.map((l, i) => ({ label: l, oc: 'o' + i, cls: s[k] === i ? 'on' : '', on: s[k] === i ? 'true' : 'false', pick: () => set({ [k]: i }) }));
    const todos = (i) => K.every((k) => s[k] === i);
    return { opA: ops('A'), opG: ops('G'), opN: ops('N'), opB: ops('B'), opM: ops('M'),
      pA: 'o' + s.A, pG: 'o' + s.G, pN: 'o' + s.N, pB: 'o' + s.B, pM: 'o' + s.M,
      conj: C.map((l, i) => ({ label: l, cls: todos(i) ? 'on' : '', on: todos(i) ? 'true' : 'false', pick: () => set({ A: i, G: i, N: i, B: i, M: i }) })),
      cr: s.rel ? '' : 'off', ar: s.rel ? 'true' : 'false', tr: () => set({ rel: !s.rel }),
      padrao: () => set({ A: 0, G: 0, N: 0, B: 0, M: 0, rel: true }) };
  }
}
</script>
<script>__boot(Component);</script>
