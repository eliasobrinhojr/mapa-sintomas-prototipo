<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { st: 0 }; }
  renderVals() {
    const L = ['Em cuidado', 'Manutenção', 'Em pausa'];
    const D = ['Diário: os itens deste cuidado aparecem em “Mais detalhes” todo dia.', 'Semanal: 1 minuto no domingo. Humor e sono do dia continuam valendo.', 'Nada é perguntado. O histórico fica guardado e você volta quando quiser.'];
    const s = this.state.st;
    return { desc: D[s], states: L.map((l, i) => ({ label: l, cls: i === s ? 'on' : '', on: i === s ? 'true' : 'false', pick: () => this.setState({ st: i }) })) };
  }
}
</script>
<script>__boot(Component);</script>
