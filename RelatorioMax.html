<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Pro Max · relatório completo para o profissional · Mapa dos Sintomas (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="app.css?v=202611152011">
<link rel="stylesheet" href="site.css?v=202611152011">
</head>
<body>
<template id="tpl">
<div class="scr tall">
<div class="bar"><a class="iconbtn" href="Resumo.html" aria-label="Voltar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#202A35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a><span class="ttl">Resumo</span><a class="crise" href="Ajuda.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9243F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle><path d="M5.6 5.6l3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6"></path></svg>Ajuda</a></div>
<div class="body" style="gap: 12px; padding-top: 0">
<div class="between"><h1 class="h1">Relatório completo</h1><span class="prem">PRO MAX</span></div>
<p class="small muted" style="margin: 0">Para consultas com mais tempo entre uma e outra, ou para um profissional novo. Mostra só o que foi registrado, sem interpretação.</p>
<div class="stack" style="gap: 6px"><b class="small">Período</b><div class="chips"><sc-for list="{{per}}" as="x" hint-placeholder-count="4"><button class="chip {{x.cls}}" onClick="{{x.pick}}" aria-pressed="{{x.on}}">{{x.label}}</button></sc-for></div></div>
<div class="card stack" style="gap: 2px"><b>O que entra</b><div class="check" style="cursor: default"><span class="bx"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span>Gráfico de humor e sono</span></div><div class="check" style="cursor: default"><span class="bx"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span>Anotações marcadas para a consulta</span></div><div class="check" style="cursor: default"><span class="bx"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span>Remédios e trocas no período</span></div><div class="check" style="cursor: default"><span class="bx"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span>O que a Lúcia e o Rafael registraram, lado a lado</span></div><div class="check" style="cursor: default"><span class="bx"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span>Números do período anterior, para comparar</span></div></div>
<a class="btn" href="Folha.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path><path d="M16 6l-4-4-4 4M12 2v13"></path></svg>Gerar relatório em PDF</a>
<span class="small muted" style="text-align: center">Feito no seu celular. Você escolhe com quem compartilhar.</span>
</div>
</div>
</template>
<div id="root"></div>
<script src="runtime.js?v=202611152011"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { p: 'Desde a última consulta' }; }
  renderVals() { return { per: ['Desde a última consulta', '3 meses', '6 meses', '12 meses'].map((l) => ({ label: l, cls: l === this.state.p ? 'on' : '', on: l === this.state.p ? 'true' : 'false', pick: () => this.setState({ p: l }) })) }; }
}
</script>
<script>__boot(Component);</script>
</body>
</html>
