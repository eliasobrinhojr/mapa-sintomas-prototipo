<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Planos · Grátis, Pro e Pro Max · Mapa dos Sintomas (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="app.css?v=202611152011">
<link rel="stylesheet" href="site.css?v=202611152011">
</head>
<body>
<template id="tpl">
<div class="scr tall">
<div class="bar"><a class="iconbtn" href="Conta.html" aria-label="Voltar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#18203A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a><span class="ttl">Conta</span><a class="crise" href="Ajuda.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9243F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle><path d="M5.6 5.6l3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6"></path></svg>Ajuda</a></div>
<div class="body" style="gap: 12px; padding-top: 0">
<h1 class="h1">Planos</h1>
<p class="small muted" style="margin: 0">Registrar o dia, ver a semana, levar o resumo de 2 semanas e pedir ajuda é grátis para sempre. Cancelar um plano não apaga nada.</p>
<div class="seg two"><sc-for list="{{per}}" as="x" hint-placeholder-count="2"><button class="{{x.cls}}" onClick="{{x.pick}}" aria-pressed="{{x.on}}">{{x.label}}</button></sc-for></div>
<div class="card stack" style="gap: 8px">
<div class="between"><b style="font-size: 18px">Grátis</b><span class="tag">Seu plano</span></div>
<span class="small muted">Registrar e levar</span>
<span class="row small" style="gap: 8px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span style="flex: 1">Registrar o dia em 20 segundos e corrigir</span></span><span class="row small" style="gap: 8px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span style="flex: 1">Semana com avisos</span></span><span class="row small" style="gap: 8px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span style="flex: 1">Resumo de 2 semanas com PDF para o médico</span></span><span class="row small" style="gap: 8px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span style="flex: 1">Lembrete diário</span></span><span class="row small" style="gap: 8px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span style="flex: 1">1 pessoa próxima</span></span><span class="row small" style="gap: 8px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span style="flex: 1">Ajuda 188 e 192, exportar e excluir</span></span>
<span class="small" style="border-top: 1px solid #E3E6EE; padding-top: 8px"><b>Conta nova:</b> os primeiros 30 dias vêm com tudo do Pro liberado, sem cartão.</span>
</div>
<div class="card stack" style="gap: 8px; border: 2px solid #0A6D62">
<div class="between"><b style="font-size: 18px">Pro</b><sc-if value="{{anual}}" hint-placeholder-val="{{true}}"><span class="prem">7 DIAS GRÁTIS</span></sc-if></div>
<span class="small muted">A consulta preparada</span>
<span><b style="font-size: 24px">{{pro}}</b> <span class="small muted">{{un}}</span></span>
<span class="small muted">{{prosub}}</span>
<span class="row small" style="gap: 8px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span style="flex: 1">Resumo de 4 semanas e “desde a última consulta”</span></span><span class="row small" style="gap: 8px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span style="flex: 1">Gráfico no resumo e no PDF</span></span><span class="row small" style="gap: 8px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span style="flex: 1">Data da consulta com lembrete na véspera</span></span><span class="row small" style="gap: 8px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span style="flex: 1">Anotações para contar na consulta</span></span><span class="row small" style="gap: 8px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span style="flex: 1">Evolução de meses, comparando dois períodos</span></span><span class="row small" style="gap: 8px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span style="flex: 1">“O que aparece junto”: sono, humor e o que aconteceu</span></span><span class="row small" style="gap: 8px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span style="flex: 1">Nome dos remédios e trocas no resumo</span></span><span class="row small" style="gap: 8px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span style="flex: 1">Lembrete só se você ainda não registrou</span></span>
<a class="btn" href="Assinar.html">Experimentar o Pro</a>
</div>
<div class="card stack" style="gap: 8px">
<div class="between"><b style="font-size: 18px">Pro Max</b><sc-if value="{{anual}}" hint-placeholder-val="{{true}}"><span class="prem">7 DIAS GRÁTIS</span></sc-if></div>
<span class="small muted">Cuidado compartilhado</span>
<span><b style="font-size: 24px">{{max}}</b> <span class="small muted">{{un}}</span></span>
<span class="small muted">{{maxsub}}</span>
<span class="row small" style="gap: 8px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span style="flex: 1">Tudo do Pro</span></span><span class="row small" style="gap: 8px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span style="flex: 1">Até 3 pessoas próximas</span></span><span class="row small" style="gap: 8px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span style="flex: 1">Escolher, item por item, o que cada uma vê</span></span><span class="row small" style="gap: 8px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span style="flex: 1">Relatório completo de até 12 meses</span></span><span class="row small" style="gap: 8px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span style="flex: 1">A visão de quem ajuda, lado a lado, no relatório</span></span>
<a class="btn sec" href="Assinar.html">Escolher o Pro Max</a>
</div>
<span class="small muted">A cobrança é feita pela loja do seu celular e renova sozinha até você cancelar. Quem ajuda você e o seu médico não pagam nada.</span>
<span class="small" style="text-align: center"><span class="ul">Restaurar compra</span> · <span class="ul">Termos</span> · <span class="ul">Privacidade</span></span>
</div>
</div>
</template>
<div id="root"></div>
<script src="runtime.js?v=202611152011"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { p: 'a' }; }
  renderVals() {
    const s = this.state, a = s.p === 'a';
    const per = [['a', 'Anual · economize 40%'], ['m', 'Mensal']].map((x) => ({ label: x[1], cls: s.p === x[0] ? 'on' : '', on: s.p === x[0] ? 'true' : 'false', pick: () => this.setState({ p: x[0] }) }));
    return { per: per, anual: a, un: a ? 'por ano' : 'por mês', pro: a ? 'R$ 99,90' : 'R$ 14,90', max: a ? 'R$ 169,90' : 'R$ 24,90',
      prosub: a ? 'Sai a R$ 8,33 por mês' : 'Sem período grátis no mensal', maxsub: a ? 'Sai a R$ 14,16 por mês' : 'Sem período grátis no mensal' };
  }
}
</script>
<script>__boot(Component);</script>
</body>
</html>
