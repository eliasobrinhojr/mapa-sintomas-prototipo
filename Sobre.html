<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sobre você · Mapa dos Sintomas (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<template id="tpl">
<div class="scr">
<div class="bar"><a class="iconbtn" href="Main.html" aria-label="Voltar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#18203A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a><span class="ttl">1 de 2</span><span style="width: 44px"></span></div>
<div class="body" style="gap: 14px">
<h1 class="h1">Para o app ficar do seu jeito</h1>
<div class="card stack" style="gap: 10px">
<span class="h3">O que você está cuidando? <span class="small muted" style="font-weight: 500">opcional</span></span>
<div class="chips"><sc-for list="{{diags}}" as="d" hint-placeholder-count="6"><button class="chip {{d.cls}}" onClick="{{d.pick}}" aria-pressed="{{d.on}}">{{d.label}}</button></sc-for></div>
<span class="small muted">Pode marcar mais de um ou pular. Só muda o que aparece no seu registro. Dá para mudar depois em Meus cuidados.</span>
</div>
<div class="card soft small">Quer que alguém próximo ajude a registrar? Você convida quando quiser: no “Dia difícil” ou em Conta.</div>
<button class="check" onClick="{{t1}}"><span class="bx {{c1}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span>Tenho 18 anos ou mais e aceito os Termos de Uso.</span></button>
<button class="check" onClick="{{t2}}"><span class="bx {{c2}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span>Autorizo o uso dos meus dados de saúde só para o app funcionar. Posso apagar tudo quando quiser.</span></button>
</div>
<div class="foot"><sc-if value="{{ok}}" hint-placeholder-val="{{true}}"><a class="btn" href="Protecao.html">Continuar</a></sc-if><sc-if value="{{no}}" hint-placeholder-val="{{false}}"><button class="btn" onClick="{{warn}}" style="opacity: .55">Continuar</button></sc-if><sc-if value="{{err}}" hint-placeholder-val="{{false}}"><span class="err" style="text-align: center">Marque as duas caixas para continuar. Sem elas, nada é gravado.</span></sc-if></div>
</div>
</template>
<div id="root"></div>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: ['Bipolar'], a: true, b: true, e: false }; }
  renderVals() {
    const s = this.state;
    const diags = ['Bipolar', 'Borderline', 'TDAH', 'Depressão', 'Ansiedade', 'Outro'].map((l) => {
      const on = s.sel.includes(l);
      return { label: l, on: on ? 'true' : 'false', cls: on ? 'on' : '', pick: () => this.setState({ sel: on ? s.sel.filter((x) => x !== l) : s.sel.concat([l]) }) };
    });
    const ok = s.a && s.b;
    return { diags, c1: s.a ? '' : 'off', c2: s.b ? '' : 'off', t1: () => this.setState({ a: !s.a, e: false }), t2: () => this.setState({ b: !s.b, e: false }),
      ok, no: !ok, err: s.e && !ok, warn: () => this.setState({ e: true }) };
  }
}
</script>
<script>__boot(Component);</script>
</body>
</html>
