<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Antes de começar · 1 de 2 · Mapa dos Sintomas (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<template id="tpl">
<div class="scr">
<div class="bar"><a class="iconbtn" href="Main.html" aria-label="Voltar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#18203A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a><span class="ttl">1 de 2</span><span style="width: 44px"></span></div>
<div class="body" style="gap: 14px">
<h1 class="h1">Antes de começar</h1>
<div class="card stack" style="gap: 12px">
<span class="row" style="gap: 10px; align-items: flex-start"><span class="ico" style="width: 26px; height: 26px; border-radius: 13px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span class="small" style="flex: 1"><b style="font-size: 15px">Seus registros são seus.</b> Ficam no celular e numa cópia protegida na sua conta.</span></span>
<span class="row" style="gap: 10px; align-items: flex-start"><span class="ico" style="width: 26px; height: 26px; border-radius: 13px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span class="small" style="flex: 1"><b style="font-size: 15px">Ninguém é avisado de nada.</b> Você decide o que mostrar e a quem.</span></span>
<span class="row" style="gap: 10px; align-items: flex-start"><span class="ico" style="width: 26px; height: 26px; border-radius: 13px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span class="small" style="flex: 1"><b style="font-size: 15px">O app não faz diagnóstico.</b> Quem avalia é o profissional que acompanha você.</span></span>
</div>
<button class="check" onClick="{{t1}}" aria-pressed="{{p1}}"><span class="bx {{c1}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span>Tenho 18 anos ou mais e aceito os Termos de Uso.</span></button>
<button class="check" onClick="{{t2}}" aria-pressed="{{p2}}"><span class="bx {{c2}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span><span>Autorizo o uso dos meus dados de saúde só para o app funcionar. Posso apagar tudo quando quiser.</span></button>
<button class="det" onClick="{{tl}}" aria-expanded="{{lstr}}"><span>Como meus dados são tratados</span><span>{{arrow}}</span></button>
<sc-if value="{{ler}}" hint-placeholder-val="{{false}}"><div class="card soft small">Seus registros servem só para montar a sua semana e o seu resumo. Não vão para anúncios nem para terceiros. Você pode baixar uma cópia ou apagar tudo em Conta, quando quiser.</div></sc-if>
<div class="card soft small">Quer que alguém próximo ajude a registrar? Você convida quando quiser: no “Dia difícil” ou em Conta.</div>
</div>
<div class="foot"><sc-if value="{{ok}}" hint-placeholder-val="{{true}}"><a class="btn" href="Protecao.html">Continuar</a></sc-if><sc-if value="{{no}}" hint-placeholder-val="{{false}}"><button class="btn" onClick="{{warn}}" style="opacity: .55">Continuar</button></sc-if><sc-if value="{{err}}" hint-placeholder-val="{{false}}"><span class="err" style="text-align: center">Marque as duas caixas para continuar.</span></sc-if></div>
</div>
</template>
<div id="root"></div>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { a: true, b: true, l: false, e: false }; }
  renderVals() {
    const s = this.state;
    const ok = s.a && s.b;
    return { c1: s.a ? '' : 'off', c2: s.b ? '' : 'off', p1: s.a ? 'true' : 'false', p2: s.b ? 'true' : 'false',
      t1: () => this.setState({ a: !s.a, e: false }), t2: () => this.setState({ b: !s.b, e: false }),
      ler: s.l, lstr: s.l ? 'true' : 'false', arrow: s.l ? '▴' : '▾', tl: () => this.setState({ l: !s.l }),
      ok, no: !ok, err: s.e && !ok, warn: () => this.setState({ e: true }) };
  }
}
</script>
<script>__boot(Component);</script>
</body>
</html>
