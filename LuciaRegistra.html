<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Registrando pela Marina · Mapa dos Sintomas (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<template id="tpl">
<div class="scr">
<div class="bar"><a class="iconbtn" href="ApoioLucia.html" aria-label="Fechar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#18203A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a><span class="ttl"></span><a class="crise" href="Crise.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9243F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path><path d="M12 9v4M12 16v.5"></path></svg>Plano de crise</a></div>
<div class="body" style="gap: 8px; padding-top: 0">
<span class="tag" style="align-self: flex-start">Sua visão sobre a Marina</span>
<h1 class="h1">Na sua visão, como a Marina está hoje?</h1>
<p class="small muted" style="margin: 0 0 4px">Fica guardado como a visão da Lúcia, ao lado do que a Marina marcar. Uma não apaga a outra. Se não souber, pode fechar.</p>
<sc-for list="{{moods}}" as="m" hint-placeholder-count="5"><button class="opt {{m.cls}}" onClick="{{m.pick}}"><span class="c {{m.color}}"></span>{{m.label}}<span class="r"></span></button></sc-for>
<div class="row" style="gap: 8px; margin-top: 6px"><b>Ela dormiu?</b><button class="chip">Bem</button><button class="chip on">Pouco</button><button class="chip">Não sei</button></div>
</div>
<div class="foot"><a class="btn" href="ApoioLucia.html">Salvar minha visão</a></div>
</div>
</template>
<div id="root"></div>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { m: 0 }; }
  renderVals() {
    const M = [['Acelerada ou fora do controle', 'e1'], ['Animada', 'e3'], ['Normal para ela', 'e4'], ['Pra baixo', 'e5'], ['Muito para baixo, tudo custa', 'e7']];
    return { moods: M.map((x, i) => ({ label: x[0], color: x[1], cls: i === this.state.m ? 'on' : '', pick: () => this.setState({ m: i }) })) };
  }
}
</script>
<script>__boot(Component);</script>
</body>
</html>
