<template id="tpl">
<div class="scr tall aura" style="height: 1123px"><div class="sb" aria-hidden="true"><span>9:41</span><span class="isl"></span><span class="ic"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 4.2a9.5 9.5 0 0 1 13 0"></path><path d="M4 7a5.8 5.8 0 0 1 8 0"></path><circle cx="8" cy="10.2" r="1.2" fill="currentColor" stroke="none"></circle></svg><svg width="26" height="12" viewBox="0 0 26 12" fill="currentColor"><rect x="0.5" y="0.5" width="22" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".45"></rect><rect x="2" y="2" width="19" height="8" rx="2"></rect><rect x="24" y="4" width="2" height="4" rx="1" opacity=".5"></rect></svg></span></div>
<div class="bar"><span style="width: 44px"></span><span class="ttl"></span><a class="crise" href="Ajuda.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9243F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle><path d="M5.6 5.6l3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6"></path></svg>Ajuda</a></div>
<div class="body" style="gap: 12px; padding-top: 0">
<h1 class="h1 big">Deixe o app <span class="lt">com a sua cara.</span></h1>
<p class="small muted" style="margin: 0">Escolha agora ou pule. Dá para mudar depois em Conta › Aparência.</p>
<div class="pv {{pvc}}" role="img" aria-label="Prévia de como o app vai ficar"><div class="pc"><b>Como você esteve hoje?</b><span class="fx"><span class="face e1 {{pc}}" aria-hidden="true"></span><span class="face e3 {{pc}}" aria-hidden="true"></span><span class="face e4 {{pc}}" aria-hidden="true"></span><span class="face e5 {{pc}}" aria-hidden="true"></span><span class="face e7 {{pc}}" aria-hidden="true"></span></span></div><span class="pb">Salvar o dia</span></div>
<div class="card stack" style="gap: 10px"><span class="h3">Ícones do humor</span>
<div class="cj" role="group" aria-label="Ícones do humor"><sc-for list="{{conj}}" as="x" hint-placeholder-count="5"><button class="ic {{x.cls}}" onClick="{{x.pick}}" aria-pressed="{{x.on}}"><span class="face e3 {{x.oc}}" aria-hidden="true"></span>{{x.label}}</button></sc-for></div>
<span class="small muted">A palavra de cada nível aparece sempre ao lado. Depois dá para escolher um desenho diferente para cada nível.</span></div>
<div class="card stack" style="gap: 10px"><span class="h3">Tema</span>
<div class="seg"><sc-for list="{{tema}}" as="x" hint-placeholder-count="3"><button class="{{x.cls}}" onClick="{{x.pick}}" aria-pressed="{{x.on}}">{{x.label}}</button></sc-for></div>
<span class="small muted">Automático segue o celular.</span></div>
<div class="card stack" style="gap: 10px"><span class="h3">Cor de destaque</span>
<div class="seg two"><sc-for list="{{cor}}" as="x" hint-placeholder-count="2"><button class="{{x.cls}}" onClick="{{x.pick}}" aria-pressed="{{x.on}}"><span class="swc" style="background: {{x.hex}}; box-shadow: 0 0 0 2px #FFFFFF"></span>{{x.label}}</button></sc-for></div></div>
</div>
<div class="foot"><a class="btn" href="Hoje.html">Continuar</a><a class="btn ghost" href="Hoje.html" onClick="{{pular}}">Pular por enquanto</a></div>
<div class="hi" aria-hidden="true"></div></div>
</template>
<div id="root"></div>
<script src="icones.js?v=202611152117"></script>
<script src="runtime.js?v=202611152117"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); const w = typeof window !== 'undefined' ? window : {};
    const g = w.__icones ? w.__icones.ler() : { A: 0, G: 0, N: 0, B: 0, M: 0 }, a = w.__apar ? w.__apar.ler() : { t: 'Automático', c: 'Teal' };
    const igual = ['G', 'N', 'B', 'M'].every((k) => g[k] === g.A);
    this.state = { i: igual ? g.A : 0, t: a.t, c: a.c }; }
  renderVals() {
    const s = this.state, C = ["Carinha", "Traço", "Clima", "Bateria", "Só cor"], w = typeof window !== 'undefined' ? window : {};
    const ic = (i) => { if (w.__icones) w.__icones.gravar({ A: i, G: i, N: i, B: i, M: i }); this.setState({ i: i }); };
    const ap = (o) => { if (w.__apar) w.__apar.gravar(o); this.setState(o); };
    const mk = (key, list) => list.map((l) => ({ label: l, cls: s[key] === l ? 'on' : '', on: s[key] === l ? 'true' : 'false', pick: () => ap({ [key]: l }) }));
    return { conj: C.map((l, i) => ({ label: l, oc: 'o' + i, cls: s.i === i ? 'on' : '', on: s.i === i ? 'true' : 'false', pick: () => ic(i) })),
      tema: mk('t', ['Automático', 'Claro', 'Escuro']),
      cor: [['Teal', '#2D7775'], ['Lavanda', '#7463A8']].map((c) => ({ label: c[0], hex: c[1], cls: s.c === c[0] ? 'on' : '', on: s.c === c[0] ? 'true' : 'false', pick: () => ap({ c: c[0] }) })),
      pc: 'o' + s.i, pvc: (s.t === 'Escuro' ? 'dark ' : '') + (s.c === 'Lavanda' ? 'lav' : ''),
      pular: () => { if (w.__icones) w.__icones.gravar({ A: 0, G: 0, N: 0, B: 0, M: 0 }); if (w.__apar) w.__apar.gravar({ t: 'Automático', c: 'Teal' }); } };
  }
}
</script>
<script>__boot(Component);</script>
</body>
