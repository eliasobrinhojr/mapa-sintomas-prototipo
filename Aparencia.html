<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Aparência · tema, cor de destaque e texto (proposta) · Mapa dos Sintomas (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">

<link rel="stylesheet" href="site.css?v=202611152054">
</head>
<body>
<template id="tpl">
<div class="scr tall aura" style="height: 1273px"><div class="sb" aria-hidden="true"><span>9:41</span><span class="isl"></span><span class="ic"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1"></rect></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 4.2a9.5 9.5 0 0 1 13 0"></path><path d="M4 7a5.8 5.8 0 0 1 8 0"></path><circle cx="8" cy="10.2" r="1.2" fill="currentColor" stroke="none"></circle></svg><svg width="26" height="12" viewBox="0 0 26 12" fill="currentColor"><rect x="0.5" y="0.5" width="22" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".45"></rect><rect x="2" y="2" width="19" height="8" rx="2"></rect><rect x="24" y="4" width="2" height="4" rx="1" opacity=".5"></rect></svg></span></div>
<div class="bar"><a class="iconbtn" href="Conta.html" aria-label="Voltar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#202A35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a><span class="ttl">Conta</span><a class="crise" href="Ajuda.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9243F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle><path d="M5.6 5.6l3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6"></path></svg>Ajuda</a></div>
<div class="body" style="gap: 12px; padding-top: 0">
<h1 class="h1">Aparência</h1>
<p class="small muted" style="margin: 0">Deixe o app do seu jeito. Nada aqui muda os seus registros nem o resumo.</p>
<div class="pv {{pvc}}" aria-label="Prévia"><div class="pc"><b>Como você esteve</b><span class="fx"><span class="face e1"></span><span class="face e3"></span><span class="face e4"></span><span class="face e5"></span><span class="face e7"></span></span></div><span class="pb">Salvar o dia</span></div>
<div class="card stack" style="gap: 10px"><span class="h3">Ícones do humor</span>
<div class="seg"><sc-for list="{{ico}}" as="x" hint-placeholder-count="3"><button class="{{x.cls}}" onClick="{{x.pick}}" aria-pressed="{{x.on}}">{{x.label}}</button></sc-for></div>
<span class="small muted">Você escolhe como os 5 níveis aparecem. A palavra de cada nível continua sempre ao lado.</span></div>
<div class="card stack" style="gap: 10px"><span class="h3">Tema</span>
<div class="seg"><sc-for list="{{tema}}" as="x" hint-placeholder-count="3"><button class="{{x.cls}}" onClick="{{x.pick}}" aria-pressed="{{x.on}}">{{x.label}}</button></sc-for></div>
<span class="small muted">Automático segue o celular. O escuro cansa menos à noite.</span></div>
<div class="card stack" style="gap: 8px"><span class="h3">Cor de destaque</span>
<sc-for list="{{cor}}" as="x" hint-placeholder-count="2"><button class="opt {{x.cls}}" onClick="{{x.pick}}" aria-pressed="{{x.on}}"><span class="swt" style="background: {{x.hex}}"></span>{{x.label}}<span class="r"></span></button></sc-for>
<span class="small muted">Vale para botões e marcações. As cores de ajuda, de aviso e do humor não mudam.</span></div>
<div class="card stack" style="gap: 10px"><span class="h3">Tamanho do texto</span>
<div class="seg two"><sc-for list="{{txt}}" as="x" hint-placeholder-count="2"><button class="{{x.cls}}" onClick="{{x.pick}}" aria-pressed="{{x.on}}">{{x.label}}</button></sc-for></div>
<span class="small muted">O app também segue o tamanho de letra escolhido no celular.</span></div>
<div class="card" style="padding: 4px 16px">
<div class="li"><span class="tx"><b style="display: block">Fundo com brilho suave</b><span class="small muted" style="display: block">Desligado, o fundo fica liso</span></span><button class="sw {{cf}}" onClick="{{tf}}" role="switch" aria-checked="{{af}}" aria-label="Fundo com brilho suave" style="border: 0; cursor: pointer"></button></div>
<div class="li"><span class="tx"><b style="display: block">Como quer ser chamada</b><span class="small muted" style="display: block">Marina</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#93A0AB" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></div>
</div>
<span class="small muted">Volta ao padrão quando quiser: tema automático, cor teal, texto padrão.</span>
</div>
<div class="hi" aria-hidden="true"></div></div>
</template>
<div id="root"></div>
<script src="runtime.js?v=202611152054"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { t: 'Automático', c: 'Teal', x: 'Padrão', f: true, i: 'Carinhas' }; }
  renderVals() {
    const s = this.state;
    const mk = (key, list) => list.map((l) => ({ label: l, cls: s[key] === l ? 'on' : '', on: s[key] === l ? 'true' : 'false', pick: () => this.setState({ [key]: l }) }));
    const cor = [['Teal', '#2D7775'], ['Lavanda', '#7463A8']].map((c) => ({ label: c[0], hex: c[1], cls: s.c === c[0] ? 'on' : '', on: s.c === c[0] ? 'true' : 'false', pick: () => this.setState({ c: c[0] }) }));
    return { tema: mk('t', ['Automático', 'Claro', 'Escuro']), cor: cor, txt: mk('x', ['Padrão', 'Maior']), ico: mk('i', ['Carinhas', 'Formas', 'Só cor']),
      pvc: (s.t === 'Escuro' ? 'dark ' : '') + (s.c === 'Lavanda' ? 'lav ' : '') + (s.x === 'Maior' ? 'big ' : '') + (s.i === 'Formas' ? 'formas' : (s.i === 'Só cor' ? 'cor' : '')),
      cf: s.f ? '' : 'off', af: s.f ? 'true' : 'false', tf: () => this.setState({ f: !s.f }) };
  }
}
</script>
<script>__boot(Component);</script>
</body>
</html>
