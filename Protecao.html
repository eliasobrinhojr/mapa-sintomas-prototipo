<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Proteção e lembrete · Mapa dos Sintomas (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<template id="tpl">
<div class="scr">
<div class="bar"><a class="iconbtn" href="Sobre.html" aria-label="Voltar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#294F46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a><span class="ttl">2 de 2</span><span style="width: 44px"></span></div>
<div class="body" style="gap: 12px">
<h1 class="h1">Seguro e na hora certa</h1>
<div class="card row"><span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#066A62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 11c0 3-1 6-3 8"></path><path d="M8 11a4 4 0 0 1 8 0c0 2.5-.5 5-1.5 7"></path><path d="M5 10a7 7 0 0 1 14 0c0 1.5-.1 3-.4 4.4"></path></svg></span><span style="flex: 1"><b style="display: block">Abrir com digital ou rosto</b><span class="small muted">PIN de 4 números como reserva</span></span><span class="sw" role="img" aria-label="Ligado"></span></div>
<div class="card stack" style="gap: 12px">
<div class="row"><span class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#066A62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10 21a2 2 0 0 0 4 0"></path></svg></span><span style="flex: 1"><b style="display: block">Lembrete do dia</b><span class="small muted">A notificação diz só: “Seus 20 segundos de hoje.”</span></span></div>
<div class="chips"><sc-for list="{{times}}" as="t" hint-placeholder-count="4"><button class="chip {{t.cls}}" onClick="{{t.pick}}">{{t.label}}</button></sc-for></div>
</div>
<div class="card row" style="border-color: #EBC4BD"><span class="ico" style="background: #F8E5E1"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B23A2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path><path d="M12 9v4M12 16v.5"></path></svg></span><span class="small" style="flex: 1"><b style="display: block; font-size: 15px">Seu plano de crise</b>Monte depois, com seu médico. Até lá, 188 e 192 ficam a um toque em todas as telas.</span></div>
</div>
<div class="foot"><a class="btn" href="Hoje.html">Começar</a></div>
</div>
</template>
<div id="root"></div>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { t: '21:00' }; }
  renderVals() {
    return { times: ['08:00', '12:30', '21:00', '22:30'].map((l) => ({ label: l, cls: l === this.state.t ? 'on' : '', pick: () => this.setState({ t: l }) })) };
  }
}
</script>
<script>__boot(Component);</script>
</body>
</html>
