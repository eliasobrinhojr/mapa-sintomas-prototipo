<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Adicionar um cuidado · Mapa dos Sintomas (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<template id="tpl">
<div class="scr">
<div class="bar"><a class="iconbtn" href="Cuidados.html" aria-label="Voltar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#18203A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a><span class="ttl">Novo cuidado</span><a class="crise" href="Crise.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9243F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path><path d="M12 9v4M12 16v.5"></path></svg>Plano de crise</a></div>
<div class="body" style="gap: 14px; padding-top: 0">
<h1 class="h1">O que você quer cuidar?</h1>
<div class="stack" style="gap: 8px"><span class="small" style="font-weight: 700">Transtornos em tratamento</span>
<div class="chips"><sc-for list="{{a}}" as="x" hint-placeholder-count="5"><button class="chip {{x.cls}}" onClick="{{x.pick}}" aria-pressed="{{x.on}}">{{x.label}}</button></sc-for></div>
<span class="small" style="font-weight: 700; margin-top: 4px">Outros cuidados com psicólogo ou psiquiatra</span>
<div class="chips"><sc-for list="{{b}}" as="x" hint-placeholder-count="4"><button class="chip {{x.cls}}" onClick="{{x.pick}}" aria-pressed="{{x.on}}">{{x.label}}</button></sc-for></div></div>
<div class="card stack" style="gap: 10px"><b>O que você quer ver mudar? <span class="small muted" style="font-weight: 500">até 3</span></b>
<div class="chips"><sc-for list="{{ind}}" as="x" hint-placeholder-count="5"><button class="chip {{x.cls}}" onClick="{{x.pick}}">{{x.label}}</button></sc-for></div>
<span class="small muted">É isso que vira o gráfico de evolução. Melhor escolher junto com quem te acompanha.</span></div>
<div class="card stack" style="gap: 10px"><b>Com que frequência?</b>
<div class="seg" style="grid-template-columns: repeat(2, minmax(0, 1fr))"><sc-for list="{{fr}}" as="x" hint-placeholder-count="2"><button class="{{x.cls}}" onClick="{{x.pick}}">{{x.label}}</button></sc-for></div>
<span class="small muted">{{frd}}</span></div>
<div class="stack" style="gap: 6px"><b>Quem acompanha <span class="small muted" style="font-weight: 500">opcional</span></b><div class="field empty">Ex.: Dra. Ana, psiquiatra</div></div>
</div>
<div class="foot"><a class="btn" href="Cuidados.html">Adicionar cuidado</a><span class="small muted" style="text-align: center">Você tem 2 cuidados. No diário cabem até 3.</span></div>
</div>
</template>
<div id="root"></div>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { c: 'Depressão', ind: ['Dias em que saí da cama', 'Dias em que fiz algo de que gosto'], f: 0 }; }
  renderVals() {
    const s = this.state;
    const one = (l) => ({ label: l, cls: l === s.c ? 'on' : '', on: l === s.c ? 'true' : 'false', pick: () => this.setState({ c: l }) });
    const ind = ['Dias em que saí da cama', 'Dias em que fiz algo de que gosto', 'Dias muito para baixo', 'Dias em que falei com alguém', 'Escolher com minhas palavras'].map((l) => { const on = s.ind.includes(l); return { label: l, cls: on ? 'on' : '', pick: () => this.setState({ ind: on ? s.ind.filter((x) => x !== l) : s.ind.concat([l]).slice(-3) }) }; });
    const FD = ['Diário: 2 ou 3 toques dentro de “Mais detalhes”. Bom para o começo.', 'Semanal: 1 minuto no domingo. Bom quando já está mais estável.'];
    return {
      a: ['Depressão', 'Ansiedade', 'Bipolar', 'Borderline', 'TDAH'].map(one),
      b: ['Estresse', 'Sono', 'Luto', 'Foco'].map(one),
      ind, frd: FD[s.f],
      fr: ['Diário', 'Semanal'].map((l, i) => ({ label: l, cls: i === s.f ? 'on' : '', pick: () => this.setState({ f: i }) }))
    };
  }
}
</script>
<script>__boot(Component);</script>
</body>
</html>
