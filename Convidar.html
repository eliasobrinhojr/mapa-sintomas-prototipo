<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Convidar pessoa próxima · Mapa dos Sintomas (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<template id="tpl">
<div class="scr">
<div class="bar"><a class="iconbtn" href="Proximo.html" aria-label="Voltar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#18203A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a><span class="ttl">Pessoa próxima</span><a class="crise" href="Ajuda.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9243F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle><path d="M5.6 5.6l3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6"></path></svg>Ajuda</a></div>
<div class="body" style="gap: 12px; padding-top: 0">
<h1 class="h1">Convidar alguém próximo</h1>
<p class="small muted" style="margin: 0">A pessoa recebe um link, baixa o app e entra com a conta dela.</p>
<label class="stack" style="gap: 6px"><b class="small">Nome de quem vai ajudar</b><input class="field" type="text" value="Lúcia" autocomplete="off" style="font-family: inherit; width: 100%"></label>
<div class="stack" style="gap: 6px"><b class="small">Quem é para você</b><div class="chips"><sc-for list="{{rel}}" as="r" hint-placeholder-count="5"><button class="chip {{r.cls}}" onClick="{{r.pick}}">{{r.label}}</button></sc-for></div></div>
<div class="card stack" style="gap: 8px"><b>O que ela pode fazer</b>
<span class="row small" style="gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Registrar o seu dia, do jeito que ela vê</span>
<span class="row small" style="gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Ver a sua semana</span>
<span class="row small muted" style="gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8C93A6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>Não vê o resumo nem a sua conta</span>
<span class="row small muted" style="gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8C93A6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>Não muda nem apaga o que você registrou</span></div>
<div style="flex: 1"></div>
<a class="btn" href="Proximo.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path><path d="M16 6l-4-4-4 4M12 2v13"></path></svg>Enviar convite pelo WhatsApp</a>
<span class="small muted" style="text-align: center">O convite vale por 7 dias e só uma vez. Depois você escolhe o que ela vê e pode remover o acesso quando quiser.</span>
</div>
</div>
</template>
<div id="root"></div>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { r: 'Mãe' }; }
  renderVals() { return { rel: ['Mãe', 'Pai', 'Companheiro(a)', 'Amigo(a)', 'Outro'].map((l) => ({ label: l, cls: l === this.state.r ? 'on' : '', pick: () => this.setState({ r: l }) })) }; }
}
</script>
<script>__boot(Component);</script>
</body>
</html>
