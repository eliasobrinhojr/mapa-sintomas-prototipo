<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dia já registrado · corrigir ou apagar · Mapa dos Sintomas (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<template id="tpl">
<div class="scr tall">
<div class="bar"><a class="iconbtn" href="Semana.html" aria-label="Fechar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#18203A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a><span class="ttl">Sábado, 17/10</span><a class="crise" href="Crise.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9243F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path><path d="M12 9v4M12 16v.5"></path></svg>Plano de crise</a></div>
<div class="body" style="gap: 10px; padding-top: 0">
<h1 class="h1">Corrigir este dia</h1>
<span class="small muted">Já registrado (salvo sáb 17/10 às 23:12). Mude o que quiser e salve de novo; para desmarcar, toque de novo na opção.</span>
<span class="between"><span class="row" style="gap: 8px"><a class="chip" href="Corrigir.html" style="gap: 6px; min-height: 44px; padding: 0 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#18203A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>Sex</a><a class="chip" href="Registro.html" style="gap: 6px; min-height: 44px; padding: 0 14px">Hoje<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#18203A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></a></span><button class="help" onClick="{{toggleHelp}}" aria-expanded="{{helpStr}}">Dicas para registrar</button></span>
<sc-if value="{{help}}" hint-placeholder-val="{{false}}"><div class="card soft small stack" style="gap: 6px"><span><b>Que dia é “hoje”.</b> O dia vai das 4h às 3h59. Registrou de madrugada, antes de dormir? Vale para o dia que está terminando.</span><span><b>Sono.</b> Vale o chute. Toque na hora em que apagou a luz e na hora em que levantou: o app faz a conta. Não lembra? Marque “Não lembro”.</span><span><b>Humor.</b> Pense na maior parte do dia. “Normal para mim” é como você costuma ser quando está bem, não o normal dos outros.</span><span><b>Remédio.</b> “Como combinado” é do jeito que o profissional orientou. Esqueceu, atrasou ou mudou a dose? Marque “Não tomei como combinado”.</span><span><b>Se aconteceu.</b> Marque só o que aconteceu de fato. Não é teste nem diagnóstico. Nada aconteceu? Deixe em branco.</span><span><b>Nota.</b> Fatos, não rótulos: o que aconteceu, quanto durou, o que veio antes.</span></div></sc-if>

<span class="h3" style="margin-top: 4px">Sono <span class="small muted" style="font-weight: 500">a noite passada · vale o chute</span></span>

<div class="card stack" style="gap: 10px; padding: 14px">
<b>Que horas apagou a luz?</b>
<div class="hsc"><sc-for list="{{dei}}" as="x" hint-placeholder-count="6"><button class="chip {{x.cls}}" onClick="{{x.pick}}" aria-pressed="{{x.on}}">{{x.label}}</button></sc-for></div>
<b>Que horas levantou?</b>
<div class="hsc"><sc-for list="{{lev}}" as="x" hint-placeholder-count="6"><button class="chip {{x.cls}}" onClick="{{x.pick}}" aria-pressed="{{x.on}}">{{x.label}}</button></sc-for></div>
<sc-if value="{{temconta}}" hint-placeholder-val="{{false}}"><div class="card soft small" style="padding: 10px 12px"><b>{{conta}}</b> · marcado: {{faixa}}. Dormiu bem menos que isso? Escolha outra faixa abaixo.</div></sc-if>
</div>
<span class="small muted" style="font-weight: 700">Ou escolha direto</span>
<div class="chips"><sc-for list="{{sono}}" as="x" hint-placeholder-count="6"><button class="chip {{x.cls}}" onClick="{{x.pick}}" aria-pressed="{{x.on}}">{{x.label}}</button></sc-for></div>

<span class="h3" style="margin-top: 8px">Humor <span class="small muted" style="font-weight: 500">a maior parte do dia</span></span>
<sc-for list="{{humor}}" as="m" hint-placeholder-count="5"><button class="opt {{m.cls}}" onClick="{{m.pick}}" aria-pressed="{{m.on}}"><span class="c {{m.color}}"></span>{{m.label}}<span class="r"></span></button></sc-for>

<span class="h3" style="margin-top: 8px">Remédio <span class="small muted" style="font-weight: 500">se você usa</span></span>
<div class="chips"><sc-for list="{{remedio}}" as="x" hint-placeholder-count="3"><button class="chip {{x.cls}}" onClick="{{x.pick}}" aria-pressed="{{x.on}}">{{x.label}}</button></sc-for></div>

<span class="h3" style="margin-top: 8px">Se aconteceu hoje <span class="small muted" style="font-weight: 500">opcional</span></span>
<div class="chips"><sc-for list="{{marcas}}" as="x" hint-placeholder-count="8"><button class="chip {{x.cls}}" onClick="{{x.pick}}" aria-pressed="{{x.on}}">{{x.label}}</button></sc-for></div>
<sc-if value="{{pen}}" hint-placeholder-val="{{false}}"><div class="card stack" style="gap: 10px; border: 2px solid #A9243F"><span class="small"><b style="font-size: 15px">Obrigado por registrar.</b> Se esses pensamentos estão fortes agora, você não precisa passar por isso sozinho: ligue <a href="tel:188" style="color: #A9243F; font-weight: 800; text-decoration: underline">188</a> (CVV, gratuito, 24 horas) ou, em emergência, <a href="tel:192" style="color: #A9243F; font-weight: 800; text-decoration: underline">192</a>.</span><span class="small">Conte também ao profissional que acompanha você, ou a alguém de confiança. O app não avisa ninguém sozinho.</span><a class="btn sec" href="Crise.html" style="min-height: 46px; border-color: #A9243F; color: #A9243F !important">Abrir meu plano de crise</a></div></sc-if>

<span class="h3" style="margin-top: 8px">Nota <span class="small muted" style="font-weight: 500">opcional · até 140 letras</span></span>
<textarea class="area" maxlength="140" rows="3" aria-label="Nota do dia" placeholder="Ex.: dormi 4 h e acordei cheia de planos">Esqueci o remédio; saí e voltei às 3h.</textarea>

<span class="h3" style="margin-top: 8px">Quem está registrando?</span>
<div class="seg two"><sc-for list="{{quem}}" as="x" hint-placeholder-count="2"><button class="{{x.cls}}" onClick="{{x.pick}}" aria-pressed="{{x.on}}">{{x.label}}</button></sc-for></div>
<span class="small muted">Num dia difícil, alguém de confiança pode marcar por você, aqui no seu celular. O resumo mostra quais dias foram marcados assim.</span>

<button class="det" onClick="{{toggle}}" aria-expanded="{{openStr}}" style="margin-top: 6px"><span>Dos meus cuidados (opcional)</span><span>{{arrow}}</span></button>
<sc-if value="{{open}}" hint-placeholder-val="{{false}}">
<div class="card stack" style="gap: 12px">
<div class="stack" style="gap: 8px"><span class="kicker">Meus sinais de virada · Bipolar</span><span class="small muted">Os sinais que você escreveu no plano de crise.</span>
<div class="chips"><sc-for list="{{sinais}}" as="x" hint-placeholder-count="6"><button class="chip {{x.cls}}" onClick="{{x.pick}}">{{x.label}}</button></sc-for></div></div>
<div class="stack" style="gap: 8px; padding-top: 12px; border-top: 1px solid #EEF0F5"><span class="kicker">Borderline · para quem marcou</span><b>Teve alguma crise hoje?</b><div class="chips"><span class="chip on">Não</span><a class="chip" href="ModBorderline.html">Sim, registrar</a></div></div>
</div>
</sc-if>
<div class="stack" style="gap: 2px; border-top: 1px solid #E3E6EE; padding-top: 12px; margin-top: 6px"><span class="small muted">Registrou no dia errado? Dá para desfazer logo depois.</span><a class="ul" href="Apagado.html" style="min-height: 44px; display: flex; align-items: center">Apagar o registro deste dia</a></div>
</div>
<div class="foot"><sc-if value="{{ok}}" hint-placeholder-val="{{true}}"><a class="btn" href="Semana.html">Salvar alteração</a></sc-if><sc-if value="{{no}}" hint-placeholder-val="{{false}}"><button class="btn" onClick="{{warn}}">Salvar alteração</button></sc-if><sc-if value="{{err}}" hint-placeholder-val="{{false}}"><span class="err" style="text-align: center">Escolha pelo menos uma opção. Dia difícil? Só o humor já vale.</span></sc-if></div>
</div>
</template>
<div id="root"></div>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { dei: '1h', lev: '6h', sono: '5 h ou menos', humor: 'Acelerado ou fora do controle', rem: 'Não tomei como combinado', m: [2], sin: [], so: false, q: 0, e: false, hp: false }; }
  renderVals() {
    const s = this.state;
    const set = (o) => this.setState(Object.assign({ e: false }, o));
    const one = (key, list) => list.map((l) => { const on = s[key] === l; return { label: l, cls: on ? 'on' : '', on: on ? 'true' : 'false', pick: () => set({ [key]: on ? null : l }) }; });
    const DEI = ['21h', '21h30', '22h', '22h30', '23h', '23h30', '0h', '0h30', '1h', '1h30', '2h'];
    const LEV = ['5h', '5h30', '6h', '6h30', '7h', '7h30', '8h', '8h30', '9h', '10h'];
    const num = (t) => { const p = t.split('h'); return parseInt(p[0], 10) + (p[1] === '30' ? 0.5 : 0); };
    const FAIXAS = ['9 h ou mais', '8 h', '7 h', '6 h', '5 h ou menos', 'Não lembro'];
    const calc = (d, l) => { let a = num(d); if (a < 12) a += 24; return Math.floor(num(l) + 24 - a); };
    const faixaDe = (h) => h >= 9 ? '9 h ou mais' : (h <= 5 ? '5 h ou menos' : h + ' h');
    const pickHora = (key, v) => { const n = Object.assign({}, s, { [key]: s[key] === v ? null : v });
      const o = { [key]: n[key] }; if (n.dei && n.lev) o.sono = faixaDe(calc(n.dei, n.lev)); set(o); };
    const horas = (key, list) => list.map((l) => { const on = s[key] === l; return { label: l, cls: on ? 'on' : '', on: on ? 'true' : 'false', pick: () => pickHora(key, l) }; });
    const sono = FAIXAS.map((l) => { const on = s.sono === l; return { label: l, cls: on ? 'on' : '', on: on ? 'true' : 'false', pick: () => set({ sono: on ? null : l, dei: null, lev: null }) }; });
    const H = [['Acelerado ou fora do controle', 'e1'], ['Animado', 'e3'], ['Normal para mim', 'e4'], ['Pra baixo', 'e5'], ['Muito para baixo, tudo custa', 'e7']];
    const humor = H.map((h) => { const on = s.humor === h[0]; return { label: h[0], color: h[1], cls: on ? 'on' : '', on: on ? 'true' : 'false', pick: () => set({ humor: on ? null : h[0] }) }; });
    const M = ['Humor mudou muito no dia', 'Irritação forte ou explosão', 'Agi por impulso', 'Perdi o foco ou esqueci algo', 'Ansiedade ou pânico', 'Evitei pessoas ou saídas', 'Álcool ou substâncias além do normal', 'Pensamentos de morte ou de me machucar'];
    const marcas = M.map((l, i) => { const on = s.m.includes(i); return { label: l, cls: on ? 'on' : '', on: on ? 'true' : 'false', pick: () => set({ m: on ? s.m.filter((x) => x !== i) : s.m.concat([i]) }) }; });
    const SIN = ['Durmo menos e não sinto falta', 'Começo vários projetos', 'Gasto mais', 'Paro de responder mensagens', 'Durmo demais', 'Nenhum sinal hoje'];
    const sinais = SIN.map((l, i) => { const on = s.sin.includes(i); return { label: l, cls: on ? 'on' : '', pick: () => set({ sin: i === 5 ? (on ? [] : [5]) : (on ? s.sin.filter((x) => x !== i) : s.sin.filter((x) => x !== 5).concat([i])) }) }; });
    const ok = !!(s.sono || s.humor || s.rem || s.m.length);
    const tem = !!(s.dei && s.lev);
    return {
      help: s.hp, helpStr: s.hp ? 'true' : 'false', toggleHelp: () => this.setState({ hp: !s.hp }),
      dei: horas('dei', DEI), lev: horas('lev', LEV), sono,
      temconta: tem, conta: tem ? 'Cerca de ' + calc(s.dei, s.lev) + ' h de sono' : '', faixa: s.sono || '',
      igual: () => set({ dei: '1h', lev: '6h', sono: '5 h ou menos' }),
      humor, remedio: one('rem', ['Tomei como combinado', 'Não tomei como combinado', 'Não uso remédio']),
      marcas, pen: s.m.includes(7),
      sinais, open: s.so, openStr: s.so ? 'true' : 'false', arrow: s.so ? '▴' : '▾', toggle: () => this.setState({ so: !s.so }),
      quem: ['Eu', 'Alguém por mim'].map((l, i) => ({ label: l, cls: s.q === i ? 'on' : '', on: s.q === i ? 'true' : 'false', pick: () => this.setState({ q: i }) })),
      ok, no: !ok, err: s.e && !ok, warn: () => this.setState({ e: true })
    };
  }
}
</script>
<script>__boot(Component);</script>
</body>
</html>
