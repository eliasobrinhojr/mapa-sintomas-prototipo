<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Para levar à consulta · Mapa dos Sintomas (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<template id="tpl">
<div class="scr">
<div class="bar"><a class="iconbtn" href="Consulta.html" aria-label="Voltar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#18203A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a><span class="ttl">Véspera · 22/10</span><a class="crise" href="Crise.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9243F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"></path><path d="M12 9v4M12 16v.5"></path></svg>Plano de crise</a></div>
<div class="body" style="gap: 16px; padding-top: 0">
<h1 class="h1">Para levar à consulta</h1>
<div class="card stack" style="gap: 8px"><div class="sh"><span class="n">1</span><b>Minhas últimas semanas</b><span class="tag" style="margin-left: auto; height: 26px">automático</span></div>
<table class="tbl"><thead><tr><th>Semana</th><th>Noites ≤5 h</th><th>Dias acel.</th><th>Dias p/ baixo</th><th>Alguém notou</th></tr></thead><tbody>
<tr><td>21/09</td><td>0</td><td>0</td><td>2</td><td>não</td></tr><tr><td>28/09</td><td>1</td><td>1</td><td>0</td><td>não</td></tr><tr><td>05/10</td><td>2</td><td>2</td><td>0</td><td>pouco</td></tr><tr><td>12/10</td><td class="hot">4</td><td>4</td><td>0</td><td>pouco</td></tr></tbody></table></div>
<div class="card stack" style="gap: 10px"><div class="sh"><span class="n">2</span><b>Desde a última consulta</b></div>
<sc-for list="{{areas}}" as="a" hint-placeholder-count="5"><div class="stack" style="gap: 6px"><span class="small" style="font-weight: 700">{{a.label}}</span><div class="seg"><sc-for list="{{a.opts}}" as="o" hint-placeholder-count="3"><button class="{{o.cls}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div></div></sc-for></div>
<div class="card stack" style="gap: 10px"><div class="sh"><span class="n">3</span><b>Remédios</b></div>
<span class="small" style="font-weight: 700">Tomei como combinado</span><div class="chips"><button class="chip">Sempre</button><button class="chip on">Quase sempre</button><button class="chip">Esqueci várias vezes</button></div>
<span class="small" style="font-weight: 700">Efeitos que senti</span><div class="chips"><button class="chip">Sono</button><button class="chip on">Sonolência</button><button class="chip">Apetite ou peso</button><button class="chip">Tremor</button><button class="chip">Libido</button><button class="chip">Nenhum</button></div></div>
<a class="card stack" href="Anotar.html" style="gap: 8px"><div class="sh"><span class="n">4</span><b>O que mais quero contar</b></div><span class="small">★ Raiva muito forte depois da reunião, umas 3 horas (12/10)</span><span class="small">★ Dormi 4 h e comecei 3 projetos novos (16/10)</span><span class="small" style="color: #0A6D62; font-weight: 700">Escolher nas anotações</span></a>
<div class="card stack" style="gap: 8px"><div class="sh"><span class="n">5</span><b>Minha pergunta de hoje</b></div><div class="field">O remédio pode ter me deixado assim acelerada?</div></div>
<div class="card alert stack" style="gap: 8px"><div class="sh"><span class="n" style="background: #A9243F">6</span><b>Pensamentos de morte ou de me machucar</b></div><div class="seg"><button>Nunca</button><button class="on">Já tive</button><button>Tenho agora</button></div><span class="small" style="color: #A9243F">“Tenho agora” abre a ajuda na hora e pede para falar disso logo no começo.</span></div>
</div>
<div class="foot"><a class="btn" href="Resumo.html">Pronto · ver a página</a></div>
</div>
</template>
<div id="root"></div>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { Humor: 'Piorou', Sono: 'Piorou', 'Energia e foco': 'Igual', 'Relações': 'Igual', 'Trabalho ou estudo': 'Piorou' }; }
  renderVals() {
    const areas = ['Humor', 'Sono', 'Energia e foco', 'Relações', 'Trabalho ou estudo'].map((k) => ({
      label: k,
      opts: ['Melhorou', 'Igual', 'Piorou'].map((o) => ({ label: o, cls: this.state[k] === o ? 'on' : '', pick: () => this.setState({ [k]: o }) }))
    }));
    return { areas };
  }
}
</script>
<script>__boot(Component);</script>
</body>
</html>
