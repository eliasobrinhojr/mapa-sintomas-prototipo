<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Seu plano · lançamento (tudo liberado) · Mapa dos Sintomas (protótipo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="site.css">
</head>
<body>
<template id="tpl">
<div class="scr tall">
<div class="bar"><a class="iconbtn" href="Conta.html" aria-label="Voltar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#18203A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a><span class="ttl">Conta</span><a class="crise" href="Ajuda.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9243F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="4"></circle><path d="M5.6 5.6l3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6"></path></svg>Ajuda</a></div>
<div class="body" style="gap: 12px; padding-top: 0">
<h1 class="h1">Seu plano</h1>
<div class="card soft stack" style="gap: 4px"><b style="font-size: 18px">Grátis</b><span class="small">No lançamento, tudo o que está no app está liberado.</span></div>
<span class="kicker" style="margin-top: 4px">Fica grátis para sempre</span>
<div class="card stack" style="gap: 8px"><span class="row small" style="gap: 8px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span style="flex: 1">Registrar o dia em 20 segundos e corrigir</span></span><span class="row small" style="gap: 8px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span style="flex: 1">Semana com avisos</span></span><span class="row small" style="gap: 8px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span style="flex: 1">Resumo de 2 semanas com PDF para o médico</span></span><span class="row small" style="gap: 8px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span style="flex: 1">Lembrete diário</span></span><span class="row small" style="gap: 8px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span style="flex: 1">1 pessoa próxima</span></span><span class="row small" style="gap: 8px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span style="flex: 1">Ajuda 188 e 192, exportar e excluir</span></span></div>
<span class="kicker" style="margin-top: 4px">Liberado agora, depois será do Pro</span>
<div class="card stack" style="gap: 8px"><span class="row small" style="gap: 8px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span style="flex: 1">Resumo de 4 semanas</span></span><span class="row small" style="gap: 8px; align-items: flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span style="flex: 1">Gráfico no resumo e no PDF</span></span></div>
<div class="warm small"><b>Quando os planos pagos chegarem,</b> avisamos aqui 30 dias antes. Nada do que você registrou é apagado ou bloqueado.</div>
<div class="card stack" style="gap: 10px"><b>O que mais ajudaria você?</b>
<span class="small muted">Estamos decidindo o que construir. Algumas destas funções poderão ser pagas. Responder é opcional.</span>
<sc-if value="{{aberta}}" hint-placeholder-val="{{true}}"><div class="chips"><sc-for list="{{ops}}" as="o" hint-placeholder-count="8"><button class="chip {{o.cls}}" onClick="{{o.pick}}" aria-pressed="{{o.on}}">{{o.label}}</button></sc-for></div>
<button class="btn sec" onClick="{{enviar}}">Enviar resposta</button></sc-if>
<sc-if value="{{enviada}}" hint-placeholder-val="{{false}}"><span class="row small" style="gap: 6px; color: #0A6D62; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0A6D62" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Obrigado. Isso ajuda a decidir o que vem primeiro.</span></sc-if>
</div>
<a class="btn ghost" href="Planos.html">Ver como os planos vão ficar</a>
</div>
</div>
</template>
<div id="root"></div>
<script src="runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { m: [], ok: false }; }
  renderVals() {
    const s = this.state, NADA = 'Nada disso';
    const L = ['Lembrete na véspera da consulta', 'Anotar o que contar na consulta', 'Ver a evolução de meses', 'Comparar dois períodos', 'Ver o que aparece junto', 'Nome dos remédios e trocas', 'Mais de uma pessoa ajudando', NADA];
    const pick = (l) => () => { let m = s.m.slice(); if (m.includes(l)) m = m.filter((x) => x !== l); else if (l === NADA) m = [NADA]; else m = m.filter((x) => x !== NADA).concat([l]); this.setState({ m: m }); };
    return { ops: L.map((l) => ({ label: l, cls: s.m.includes(l) ? 'on' : '', on: s.m.includes(l) ? 'true' : 'false', pick: pick(l) })),
      aberta: !s.ok, enviada: s.ok, enviar: () => this.setState({ ok: true }) };
  }
}
</script>
<script>__boot(Component);</script>
</body>
</html>
