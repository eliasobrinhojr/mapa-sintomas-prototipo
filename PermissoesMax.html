<div class="body" style="gap: 12px; padding-top: 0">
<div class="between"><h1 class="h1">O que a Lúcia vê</h1><span class="prem">PRO MAX</span></div>
<p class="small muted" style="margin: 0">Você muda quando quiser. Ela não vê o resumo, a sua conta nem as outras pessoas.</p>
<div class="card" style="padding: 4px 16px">
<div class="li"><span class="tx"><b style="display: block">Registrar o meu dia</b><span class="small muted" style="display: block">Do jeito que ela vê. Não muda o que você registra.</span></span><span class="small muted" style="font-weight: 700">sempre</span></div>
<div class="li"><span class="tx"><b style="display: block">Ver a minha semana</b><span class="small muted" style="display: block">Escolha abaixo o que aparece para ela</span></span><button class="sw {{csem}}" onClick="{{tsem}}" role="switch" aria-checked="{{asem}}" aria-label="Ver a minha semana" style="border: 0; cursor: pointer"></button></div>
<sc-if value="{{det}}" hint-placeholder-val="{{true}}"><div class="li" style="padding-left: 16px"><span class="tx"><b style="display: block">Humor</b></span><button class="sw {{chum}}" onClick="{{thum}}" role="switch" aria-checked="{{ahum}}" aria-label="Humor" style="border: 0; cursor: pointer"></button></div><div class="li" style="padding-left: 16px"><span class="tx"><b style="display: block">Sono</b></span><button class="sw {{cson}}" onClick="{{tson}}" role="switch" aria-checked="{{ason}}" aria-label="Sono" style="border: 0; cursor: pointer"></button></div><div class="li" style="padding-left: 16px"><span class="tx"><b style="display: block">Remédio</b></span><button class="sw {{crem}}" onClick="{{trem}}" role="switch" aria-checked="{{arem}}" aria-label="Remédio" style="border: 0; cursor: pointer"></button></div><div class="li" style="padding-left: 16px"><span class="tx"><b style="display: block">“Se aconteceu hoje”</b><span class="small muted" style="display: block">Inclui pensamentos de morte</span></span><button class="sw {{caco}}" onClick="{{taco}}" role="switch" aria-checked="{{aaco}}" aria-label="“Se aconteceu hoje”" style="border: 0; cursor: pointer"></button></div><div class="li" style="padding-left: 16px"><span class="tx"><b style="display: block">Minhas notas</b></span><button class="sw {{cnot}}" onClick="{{tnot}}" role="switch" aria-checked="{{anot}}" aria-label="Minhas notas" style="border: 0; cursor: pointer"></button></div></sc-if>
<div class="li"><span class="tx"><b style="display: block">O que ela registra entra no meu relatório</b><span class="small muted" style="display: block">Marcado com o nome dela, ao lado do seu</span></span><button class="sw {{crel}}" onClick="{{trel}}" role="switch" aria-checked="{{arel}}" aria-label="O que ela registra entra no meu relatório" style="border: 0; cursor: pointer"></button></div>
</div>
<sc-if value="{{semdet}}" hint-placeholder-val="{{false}}"><span class="small muted">Com “Ver a minha semana” desligado, a Lúcia só registra.</span></sc-if>
<button class="btn sec" style="border-color: #A9243F; color: #A9243F !important">Remover o acesso da Lúcia</button>

<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sem: true, hum: true, son: true, rem: true, aco: false, not: false, rel: true }; }
  renderVals() {
    const s = this.state, o = {};
    Object.keys(s).forEach((k) => { o['c' + k] = s[k] ? '' : 'off'; o['a' + k] = s[k] ? 'true' : 'false'; o['t' + k] = () => this.setState({ [k]: !s[k] }); });
    o.det = s.sem; o.semdet = !s.sem;
    return o;
  }
}
</script>
<script>__boot(Component);</script>
